[package]
name = "uxid"
version = "1.0.0"
authors = ["JohnnyT <ubergeek3141@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/riddler/uxid-rs"
readme = "README.md"
description = "Prefixed, K-sortable identifiers a person can read, wire-compatible with the Elixir uxid package."
keywords = ["uxid", "id", "identifier", "sortable", "no_std"]
categories = ["encoding", "no-std"]
include = ["/src/", "/Cargo.toml", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[features]
default = ["std", "getrandom"]
std = []
getrandom = ["dep:getrandom"]
serde = ["dep:serde"]

[dependencies]
getrandom = { version = "0.4", optional = true }
serde = { version = "1", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
